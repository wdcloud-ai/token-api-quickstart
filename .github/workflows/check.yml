name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run static checks
        run: bash scripts/check.sh
