<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
      body {
        font-family: "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
        color: #f8fbff;
        background: #03112d;
      }
      main {
        position: relative;
        width: 1280px;
        height: 640px;
        padding: 62px 72px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(1, 10, 30, .98) 0%, rgba(2, 15, 42, .94) 50%, rgba(2, 14, 38, .24) 100%),
          url("../../social/xiaohongshu/quickstart-launch/assets/background-api-gateway.png") center 60% / cover;
      }
      .brand { color: #9ddcff; font-size: 25px; font-weight: 700; letter-spacing: .05em; }
      .kicker { margin-top: 64px; color: #4bd8ff; font-size: 23px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 16px 0 20px; font-size: 64px; line-height: 1.1; letter-spacing: -.035em; }
      h1 span { color: #55ddff; }
      p { margin: 0; color: #c8dff6; font-size: 25px; line-height: 1.55; }
      .pill { display: inline-block; margin-top: 30px; padding: 11px 18px; border: 1px solid rgba(116, 213, 255, .45); border-radius: 999px; color: #dff5ff; font-size: 18px; background: rgba(1, 25, 62, .72); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">WDCloud API Quickstart</div>
      <div class="kicker">ONE KEY · MULTIPLE AI MODELS</div>
      <h1>一个 API Key<br /><span>调用多家 AI 模型</span></h1>
      <p>curl · Python · Node.js<br />Claude Code · Codex · Gemini CLI</p>
      <div class="pill">可复制配置 · 明确验证边界 · MIT License</div>
    </main>
  </body>
</html>
